[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "os-vrhovci-jedilnik"
version = "0.1.0"
description = "Pretvorba PDF jedilnika OŠ Vrhovci v JSON"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Mitja Makovec"}]
license = {text = "MIT"}

[project.scripts]
vrhovci-jedilnik = "vrhovci_jedilnik.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
